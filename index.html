        .toggle-btn.partial.active { background: var(--warning); border-color: var(--warning); color: white; }
        .toggle-btn.no.active { background: var(--danger); border-color: var(--danger); color: white; }
        .toggle-btn.na.active { background: var(--text-light); border-color: var(--text-light); color: white; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

// Initialization
function init() {
    checkStandalone();
    render();
    updateStats();
}

function checkStandalone() {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isIOS && !isStandalone) {
        setTimeout(() => {
            const banner = document.querySelector('.install-banner');
            if (banner) banner.classList.add('show');
        }, 3000);
    }
}

// Render application
function render() {
    const section = SECTIONS[currentTab];
    let html = `
        <div class="header">
            <h1>🛡️ Security Assessment</h1>
            <p>Complete 60+ Item Professional Evaluation - Matches Full 26-Page Document</p>
            <div class="install-banner">
                <strong>📱 Install: </strong>Tap Share ⬆️ → "Add to Home Screen"
            </div>
            <div class="progress-wrapper">
                <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
                <div class="progress-text" id="progressText">0% Complete</div>
            </div>
        </div>
        <div class="tabs">
            ${Object.keys(SECTIONS).map(key => `
                <span class="tab ${currentTab === key ? 'active' : ''}" onclick="changeTab('${key}')">
                    ${SECTIONS[key].title}
                </span>
            `).join('')}
        </div>
        <div class="content">
            <div class="section-title">${section.title}</div>
            <div class="section-desc">${section.desc}</div>
    `;

    if (section.fields) {
        section.fields.forEach(field => {
            const val = data[field.id] || '';
            html += `
                <div class="form-group">
                    <label class="label">${field.label}</label>
                    ${field.type === 'select' ? `
                        <select onchange="save('${field.id}', this.value)">
                            <option value="">Select...</option>
                            ${field.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}
                        </select>
                    ` : field.type === 'textarea' ? `
                        <textarea onchange="save('${field.id}', this.value)" placeholder="${field.placeholder || ''}">${val}</textarea>
                    ` : `
                        <input type="text" value="${val}" onchange="save('${field.id}', this.value)" placeholder="${field.placeholder || ''}">
                    `}
                </div>
            `;
        });
    } else if (section.subs) {
        section.subs.forEach(sub => {
            html += `<div class="subsection">${sub.name}</div>`;
            sub.items.forEach(itemStr => {
                const [id, question] = itemStr.split('|');
                const d = data[id] || {};
                html += `
                    <div class="card">
                        <div class="question">${question}</div>
                        <div class="toggle-btns">
                            <button class="toggle-btn yes ${d.v === 'yes' ? 'active' : ''}" onclick="toggle('${id}', 'yes')">✓ YES</button>
                            <button class="toggle-btn partial ${d.v === 'partial' ? 'active' : ''}" onclick="toggle('${id}', 'partial')">◐ PARTIAL</button>
                            <button class="toggle-btn no ${d.v === 'no' ? 'active' : ''}" onclick="toggle('${id}', 'no')">✗ NO</button>
                            <button class="toggle-btn na ${d.v === 'na' ? 'active' : ''}" onclick="toggle('${id}', 'na')">— N/A</button>
                        </div>
                        ${['yes', 'partial', 'no', 'na'].map(v => {
                            const rec = getRec(id, v);
                            return `<div class="rec ${d.v === v ? 'show' : ''}" id="rec-${id}-${v}">
                                <div class="badge badge-${rec.s}">${rec.s}</div>
                                <div>${rec.t}</div>
                            </div>`;
                        }).join('')}
                        <textarea class="notes" placeholder="Additional notes..." onchange="saveNote('${id}', this.value)">${d.n || ''}</textarea>
                    </div>
                `;
            });
        });
    }

    html += `
        </div>
        <div class="bottom-bar">
            <div class="stats">
                <div class="stat"><div class="stat-value" id="statDone">0</div><div class="stat-label">Done</div></div>
                <div class="stat"><div class="stat-value" id="statCritical">0</div><div class="stat-label">Critical</div></div>
                <div class="stat"><div class="stat-value" id="statIssues">0</div><div class="stat-label">Issues</div></div>
                <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total</div></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="clearData()">🗑️ Clear</button>
                <button class="btn btn-primary" onclick="generate()">📄 Report</button>
            </div>
        </div>
    `;

    document.getElementById('app').innerHTML = html;
}

function changeTab(tab) {
    currentTab = tab;
    render();
    updateStats();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function save(id, val) {
    data[id] = val;
    localStorage.setItem('securityAssessment', JSON.stringify(data));
    updateStats();
    showToast('💾 Saved');
}

function toggle(id, val) {
    if (!data[id]) data[id] = {};
    data[id].v = val;
    localStorage.setItem('securityAssessment', JSON.stringify(data));
    
    // Remove active class from ALL buttons for this item (fixed selector)
    document.querySelectorAll(`button[onclick*="toggle('${id}',"]`).forEach(btn => btn.classList.remove('active'));
    // Add active class to the clicked button
    document.querySelector(`button[onclick="toggle('${id}', '${val}')"]`).classList.add('active');
    
    // Hide all recommendations for this item
    document.querySelectorAll(`[id^="rec-${id}-"]`).forEach(rec => rec.classList.remove('show'));
    // Show the selected recommendation
    const recEl = document.getElementById(`rec-${id}-${val}`);
    if (recEl) recEl.classList.add('show');
    
    updateStats();
    showToast('💾 Saved');
}

function saveNote(id, note) {
    if (!data[id]) data[id] = {};
    data[id].n = note;
    localStorage.setItem('securityAssessment', JSON.stringify(data));
    showToast('💾 Note saved');
}

function updateStats() {
    let total = 0, done = 0, critical = 0, issues = 0;
    
    Object.values(SECTIONS).forEach(sec => {
        if (sec.fields) total += sec.fields.length;
        else if (sec.subs) {
            sec.subs.forEach(sub => {
                total += sub.items.length;
                sub.items.forEach(itemStr => {
                    const id = itemStr.split('|')[0];
                    if (data[id]?.v) {
                        if (data[id].v === 'no') critical++;
                        if (data[id].v !== 'yes' && data[id].v !== 'na') issues++;
                    }
                });
            });
        }
    });

    done = Object.keys(data).filter(k => data[k]?.v || (typeof data[k] === 'string' && data[k])).length;
    const pct = Math.round((done / total) * 100);

    const bar = document.getElementById('progressBar');
    const text = document.getElementById('progressText');
    if (bar) bar.style.width = pct + '%';
    if (text) text.textContent = pct + '% Complete (' + done + '/' + total + ')';
    
    const statDone = document.getElementById('statDone');
    const statCritical = document.getElementById('statCritical');
    const statIssues = document.getElementById('statIssues');
    const statTotal = document.getElementById('statTotal');
    if (statDone) statDone.textContent = done;
    if (statCritical) statCritical.textContent = critical;
    if (statIssues) statIssues.textContent = issues;
    if (statTotal) statTotal.textContent = total;
}

async function generate() {
    // Check if libraries are loaded
    if (!window.jspdf || !window.Chart) {
        alert('PDF libraries are still loading. Please wait a moment and try again.');
        console.error('Libraries not loaded:', { jspdf: !!window.jspdf, Chart: !!window.Chart });
        // Fallback to text report
        generateTextReport();
        return;
    }
    
    try {
        await generatePDFReport();
    } catch (error) {
        console.error('PDF generation failed:', error);
        alert('PDF generation encountered an error. Generating text report instead.');
        generateTextReport();
    }
}

function generateTextReport() {
    const today = new Date().toLocaleDateString();
    let report = '═══════════════════════════════════════════════════════════\n';
    report += '            RESIDENTIAL SECURITY ASSESSMENT REPORT\n';
    report += '═══════════════════════════════════════════════════════════\n\n';
    report += `Assessment Date: ${today}\n\n`;
    
    report += '─────────────────────────────────────────────────────────────\n';
    report += 'PROPERTY INFORMATION\n';
    report += '─────────────────────────────────────────────────────────────\n';
    report += `Property: ${data.propName || 'Not specified'}\n`;
    report += `Address: ${data.address || 'Not specified'}\n`;
    report += `Threat Level: ${data.threat || 'Not specified'}\n\n`;

    // Collect all findings
    let findings = [];
    Object.values(SECTIONS).forEach(sec => {
        if (sec.subs) {
            sec.subs.forEach(sub => {
                sub.items.forEach(itemStr => {
                    const [id, question] = itemStr.split('|');
                    const d = data[id];
                    if (d?.v) {
                        findings.push({
                            section: sec.title,
                            subsection: sub.name,
                            q: question,
                            v: d.v,
                            r: getRec(id, d.v),
                            n: d.n
                        });
                    }
                });
            });
        }
    });

    const critical = findings.filter(f => f.r.s === 'critical');
    const important = findings.filter(f => f.r.s === 'important');
    const recommended = findings.filter(f => f.r.s === 'recommended');
    const good = findings.filter(f => f.r.s === 'good');
    const na = findings.filter(f => f.r.s === 'na');
    
    report += `ASSESSMENT SUMMARY\n`;
    report += `─────────────────────────────────────────────────────────────\n`;
    report += `Total Items Assessed: ${findings.length}\n`;
    report += `Critical Issues: ${critical.length}\n`;
    report += `Important Issues: ${important.length}\n`;
    report += `Recommended: ${recommended.length}\n`;
    report += `Compliant: ${good.length}\n`;
    report += `Not Applicable: ${na.length}\n\n`;

    // Critical Findings
    if (critical.length > 0) {
        report += `\n═══════════════════════════════════════════════════════════\n`;
        report += '                    CRITICAL FINDINGS\n';
        report += '═══════════════════════════════════════════════════════════\n\n';
        
        critical.forEach((f, i) => {
            report += `${i+1}. ${f.q}\n`;
            report += `   Section: ${f.section}\n`;
            report += `   Recommendation: ${f.r.t}\n`;
            if (f.n) report += `   Notes: ${f.n}\n`;
            report += '\n';
        });
    }

    // Important Findings
    if (important.length > 0) {
        report += `\n═══════════════════════════════════════════════════════════\n`;
        report += '                   IMPORTANT FINDINGS\n';
        report += '═══════════════════════════════════════════════════════════\n\n';
        
        important.forEach((f, i) => {
            report += `${i+1}. ${f.q}\n`;
            report += `   Recommendation: ${f.r.t}\n`;
            if (f.n) report += `   Notes: ${f.n}\n`;
            report += '\n';
        });
    }

    report += '\n═══════════════════════════════════════════════════════════\n';
    report += 'END OF REPORT\n';
    report += '═══════════════════════════════════════════════════════════\n';

    // Download as text file
    const blob = new Blob([report], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const fileName = `Security_Assessment_${data.propName || 'Report'}_${new Date().toISOString().split('T')[0]}.txt`;
    a.download = fileName.replace(/[^a-z0-9._-]/gi, '_');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showToast('✅ Text report downloaded!');
}

function clearData() {
    if (confirm('⚠️ Clear all data? This cannot be undone.')) {
        localStorage.removeItem('securityAssessment');
        data = {};
        render();
        updateStats();
        showToast('🗑️ Cleared');
    }
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}
